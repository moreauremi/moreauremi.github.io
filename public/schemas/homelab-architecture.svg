<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
  <title id="t">Homelab sous Proxmox — architecture</title>
  <desc id="d">Mes appareils (navigateur web, application Swiftfin), chez moi comme à distance, et les ordinateurs de mes camarades de classe rejoignent le homelab par le VPN Tailscale, un réseau privé chiffré : le serveur n'est pas exposé sur Internet. Le homelab est un vieux PC récupéré qui fait tourner l'hyperviseur Proxmox VE, avec Jellyfin (bibliothèque de vidéos), le NAS (stockage de fichiers) et une machine virtuelle de projet, partagée avec mes camarades pour nos projets de classe. Mes camarades se connectent à cette machine virtuelle.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d23"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e3c8c"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Titre -->
  <text x="32" y="44" font-size="20" font-weight="600" fill="#1a1d23">Homelab sous Proxmox — architecture</text>
  <text x="32" y="68" font-size="13" fill="#4a5260">Un vieux PC récupéré, virtualisé avec Proxmox, joignable à distance par VPN</text>
  <line x1="32" y1="84" x2="768" y2="84" stroke="#1a1d23" stroke-width="1"/>

  <!-- Mes appareils -->
  <rect x="32" y="128" width="200" height="150" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="48" y="154" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">MES APPAREILS</text>
  <text x="48" y="184" font-size="13" font-weight="600" fill="#1a1d23">Navigateur web</text>
  <text x="48" y="208" font-size="13" font-weight="600" fill="#1a1d23">Application Swiftfin</text>
  <line x1="48" y1="226" x2="216" y2="226" stroke="#d5d9e0" stroke-width="1"/>
  <text x="48" y="248" font-size="12" fill="#4a5260">chez moi comme</text>
  <text x="48" y="266" font-size="12" fill="#4a5260">à distance</text>

  <!-- Mes camarades de classe -->
  <rect x="32" y="310" width="200" height="140" rx="6" fill="#ffffff" stroke="#1e3c8c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="336" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">MES CAMARADES</text>
  <text x="48" y="366" font-size="13" font-weight="600" fill="#1a1d23">Leur ordinateur</text>
  <line x1="48" y1="384" x2="216" y2="384" stroke="#d5d9e0" stroke-width="1"/>
  <text x="48" y="406" font-size="12" fill="#4a5260">projets de classe,</text>
  <text x="48" y="424" font-size="12" fill="#4a5260">sur la VM de projet</text>

  <!-- Tailscale -->
  <rect x="268" y="150" width="136" height="300" rx="8" fill="#eef2fa" stroke="#1e3c8c" stroke-width="1.5"/>
  <text x="284" y="176" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">TAILSCALE</text>
  <text x="284" y="204" font-size="16" font-weight="600" fill="#1a1d23">VPN</text>
  <text x="284" y="230" font-size="12" fill="#1a1d23">réseau privé</text>
  <text x="284" y="248" font-size="12" fill="#1a1d23">chiffré</text>
  <text x="284" y="408" font-size="12" fill="#4a5260">non exposé</text>
  <text x="284" y="426" font-size="12" fill="#4a5260">sur Internet</text>

  <!-- Vieux PC : Proxmox, Jellyfin, NAS, VM de projet -->
  <rect x="442" y="112" width="326" height="416" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="458" y="136" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">VIEUX PC RÉCUPÉRÉ</text>

  <rect x="458" y="150" width="294" height="362" rx="6" fill="#ffffff" stroke="#4a5260" stroke-width="1.5"/>
  <text x="474" y="174" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">PROXMOX VE</text>
  <text x="474" y="192" font-size="12" fill="#4a5260">hyperviseur</text>

  <rect x="474" y="206" width="262" height="64" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="490" y="232" font-size="15" font-weight="600" fill="#1a1d23">Jellyfin</text>
  <text x="490" y="254" font-size="12" fill="#4a5260">bibliothèque de vidéos</text>

  <rect x="474" y="282" width="262" height="64" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="490" y="308" font-size="15" font-weight="600" fill="#1a1d23">NAS</text>
  <text x="490" y="330" font-size="12" fill="#4a5260">stockage de fichiers</text>

  <rect x="474" y="358" width="262" height="80" rx="6" fill="#eef2fa" stroke="#1e3c8c" stroke-width="1.5"/>
  <text x="490" y="384" font-size="15" font-weight="600" fill="#1a1d23">VM de projet</text>
  <text x="490" y="406" font-size="12" fill="#4a5260">partagée avec mes camarades</text>
  <text x="490" y="424" font-size="12" fill="#4a5260">pour nos projets de classe</text>

  <text x="474" y="474" font-size="11.5" fill="#4a5260">services répartis entre conteneurs</text>
  <text x="474" y="492" font-size="11.5" fill="#4a5260">Docker et machines virtuelles</text>

  <!-- Flèches pleines : mes accès (appareils → Tailscale → services) -->
  <g fill="none" stroke="#1a1d23" stroke-width="1.5" marker-end="url(#a)">
    <path d="M232 203 H267"/>
    <path d="M404 238 H473"/>
    <path d="M404 314 H473"/>
    <path d="M404 386 H473"/>
  </g>

  <!-- Flèches pointillées : accès de mes camarades (→ Tailscale → VM de projet) -->
  <g fill="none" stroke="#1e3c8c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)">
    <path d="M232 380 H267"/>
    <path d="M404 418 H473"/>
  </g>

  <!-- Pied -->
  <line x1="32" y1="552" x2="768" y2="552" stroke="#d5d9e0" stroke-width="1"/>
  <text x="32" y="576" font-size="11.5" fill="#4a5260">Réalisation : Homelab sous Proxmox</text>
  <text x="768" y="576" font-size="11.5" fill="#4a5260" text-anchor="end">Rémi Moreau · remim.me</text>
</svg>
