<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 632" width="800" height="632" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
  <title id="t">RMutils — fonctionnement</title>
  <desc id="d">La clé USB contient RMutils.bat (version complète), RMutils_Lite.bat (sans droits administrateur) et la liste d'applications RMutils_apps.txt. Sur le PC Windows, un double-clic lance l'en-tête batch : cmd.exe vérifie les droits et se relance en administrateur (fenêtre UAC). PowerShell relit ensuite le même fichier et exécute le code placé après le marqueur #PSBEGIN, qui affiche le menu au clavier. Le menu pilote les outils de Windows : Windows Update par son API COM, winget pour les applications, DISM et SFC pour les fichiers système, netsh et pnputil pour le réseau, le Wi-Fi et les pilotes. Le journal de la session, les rapports HTML et les sauvegardes sont écrits sur la clé, dans un dossier par PC.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <rect width="800" height="632" fill="#ffffff"/>

  <!-- Titre -->
  <text x="32" y="44" font-size="20" font-weight="600" fill="#1a1d23">RMutils — fonctionnement</text>
  <text x="32" y="68" font-size="13" fill="#4a5260">Du double-clic sur la clé USB au rapport enregistré sur la clé</text>
  <line x1="32" y1="84" x2="768" y2="84" stroke="#1a1d23" stroke-width="1"/>

  <!-- Clé USB -->
  <rect x="32" y="112" width="200" height="318" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="48" y="134" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">CLÉ USB</text>

  <rect x="48" y="148" width="168" height="56" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="62" y="172" font-size="14" font-weight="600" fill="#1a1d23">RMutils.bat</text>
  <text x="62" y="192" font-size="12" fill="#4a5260">version complète</text>

  <rect x="48" y="214" width="168" height="56" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="62" y="238" font-size="14" font-weight="600" fill="#1a1d23">RMutils_Lite.bat</text>
  <text x="62" y="258" font-size="12" fill="#4a5260">sans droits admin</text>

  <rect x="48" y="280" width="168" height="40" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="62" y="305" font-size="13" font-weight="600" fill="#1a1d23">RMutils_apps.txt</text>

  <rect x="48" y="332" width="168" height="84" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="62" y="353" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">ÉCRIT SUR LA CLÉ</text>
  <text x="62" y="375" font-size="12" fill="#1a1d23">RMutils_logs\</text>
  <text x="62" y="393" font-size="12" fill="#1a1d23">RMutils_export\</text>
  <text x="76" y="409" font-size="12" fill="#4a5260">&lt;nom du PC&gt;\</text>

  <!-- PC Windows -->
  <rect x="272" y="112" width="256" height="318" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="134" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">PC WINDOWS</text>

  <rect x="292" y="148" width="216" height="72" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="308" y="174" font-size="15" font-weight="600" fill="#1a1d23">cmd.exe</text>
  <text x="308" y="194" font-size="12" fill="#4a5260">vérifie les droits,</text>
  <text x="308" y="210" font-size="12" fill="#4a5260">relance en admin (UAC)</text>

  <rect x="292" y="248" width="216" height="72" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="308" y="274" font-size="15" font-weight="600" fill="#1a1d23">PowerShell</text>
  <text x="308" y="294" font-size="12" fill="#4a5260">relit le même fichier,</text>
  <text x="308" y="310" font-size="12" fill="#4a5260">exécute après #PSBEGIN</text>

  <rect x="292" y="348" width="216" height="64" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="308" y="374" font-size="15" font-weight="600" fill="#1a1d23">Menu au clavier</text>
  <text x="308" y="394" font-size="12" fill="#4a5260">7 rubriques</text>

  <!-- Outils de Windows -->
  <rect x="568" y="112" width="200" height="318" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="584" y="134" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">OUTILS DE WINDOWS</text>

  <rect x="584" y="148" width="168" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="598" y="172" font-size="14" font-weight="600" fill="#1a1d23">Windows Update</text>
  <text x="598" y="192" font-size="12" fill="#4a5260">API COM</text>

  <rect x="584" y="218" width="168" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="598" y="242" font-size="14" font-weight="600" fill="#1a1d23">winget</text>
  <text x="598" y="262" font-size="12" fill="#4a5260">applications</text>

  <rect x="584" y="288" width="168" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="598" y="312" font-size="14" font-weight="600" fill="#1a1d23">DISM et SFC</text>
  <text x="598" y="332" font-size="12" fill="#4a5260">fichiers système</text>

  <rect x="584" y="358" width="168" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="598" y="382" font-size="14" font-weight="600" fill="#1a1d23">netsh, pnputil</text>
  <text x="598" y="402" font-size="12" fill="#4a5260">réseau, pilotes</text>

  <!-- Flèches -->
  <g fill="none" stroke="#1a1d23" stroke-width="1.5" marker-end="url(#a)">
    <path d="M216 176 H289"/>
    <path d="M400 220 V245"/>
    <path d="M400 320 V345"/>
    <path d="M508 380 H565"/>
    <path d="M292 396 H219"/>
  </g>

  <!-- Pastilles des étapes -->
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="252" cy="160" r="10" fill="#1e3c8c"/><text x="252" y="164">1</text>
    <circle cx="420" cy="233" r="10" fill="#1e3c8c"/><text x="420" y="237">2</text>
    <circle cx="420" cy="333" r="10" fill="#1e3c8c"/><text x="420" y="337">3</text>
    <circle cx="538" cy="364" r="10" fill="#1e3c8c"/><text x="538" y="368">4</text>
    <circle cx="252" cy="412" r="10" fill="#1e3c8c"/><text x="252" y="416">5</text>
  </g>

  <!-- Légende des étapes -->
  <g font-size="12" fill="#1a1d23">
    <g font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">
      <circle cx="41" cy="466" r="9" fill="#1e3c8c"/><text x="41" y="470">1</text>
      <circle cx="41" cy="490" r="9" fill="#1e3c8c"/><text x="41" y="494">2</text>
      <circle cx="41" cy="514" r="9" fill="#1e3c8c"/><text x="41" y="518">3</text>
      <circle cx="41" cy="538" r="9" fill="#1e3c8c"/><text x="41" y="542">4</text>
      <circle cx="41" cy="562" r="9" fill="#1e3c8c"/><text x="41" y="566">5</text>
    </g>
    <text x="58" y="470">Double-clic sur RMutils.bat, directement depuis la clé USB</text>
    <text x="58" y="494">cmd.exe vérifie les droits et se relance en administrateur (fenêtre UAC)</text>
    <text x="58" y="518">PowerShell relit le même fichier et exécute le code placé après #PSBEGIN</text>
    <text x="58" y="542">Le menu pilote les outils de Windows : mises à jour, diagnostic, réparation…</text>
    <text x="58" y="566">Journal, rapports HTML et sauvegardes sont écrits sur la clé, un dossier par PC</text>
  </g>

  <!-- Pied -->
  <line x1="32" y1="590" x2="768" y2="590" stroke="#d5d9e0" stroke-width="1"/>
  <text x="32" y="612" font-size="11.5" fill="#4a5260">Réalisé avec Claude Code</text>
  <text x="768" y="612" font-size="11.5" fill="#4a5260" text-anchor="end">Rémi Moreau · remim.me</text>
</svg>
