  <text x="632" y="358" font-size="12" fill="#4a5260">33 sources</text>

  <rect x="620" y="396" width="136" height="72" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="632" y="424" font-size="15" font-weight="600" fill="#1a1d23">Copilot</text>
  <text x="632" y="446" font-size="12" fill="#4a5260">IA de GitHub</text>

  <!-- Flèches -->
  <g fill="none" stroke="#1a1d23" stroke-width="1.5" marker-end="url(#a)">
    <path d="M232 160 H291"/>
    <path d="M619 160 H549"/>
    <path d="M549 200 H584 V252 H619"/>
    <path d="M232 494 H291"/>
    <path d="M420 447 V409" marker-start="url(#a)"/>
    <path d="M420 255 V217"/>
    <path d="M619 344 H549"/>
    <path d="M549 392 H584 V432 H619" marker-start="url(#a)"/>
  </g>
  <g font-size="11" fill="#4a5260">
    <text x="262" y="152" text-anchor="middle">HTTPS</text>
    <text x="584" y="152" text-anchor="middle">DNS</text>
    <text x="262" y="486" text-anchor="middle">envois</text>
    <text x="410" y="432" text-anchor="end">déclenche</text>
    <text x="430" y="432">enregistre</text>
    <text x="430" y="240">publie</text>
  </g>

  <!-- Notes -->
  <line x1="32" y1="588" x2="768" y2="588" stroke="#d5d9e0" stroke-width="1"/>
  <g font-size="12" fill="#4a5260">
    <text x="32" y="612">Chaque envoi relance les tests : une erreur bloque la mise en ligne, le site reste intact.</text>
    <text x="32" y="632">Le tableau de bord écrit dans le dépôt par l'API GitHub, avec un jeton aux droits minimaux ;</text>
    <text x="32" y="652">la veille et la reformulation passent par GitHub Actions, où reste le secret de l'IA.</text>
  </g>
</svg>
