<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 668" width="800" height="668" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
  <title id="t">Portfolio RémiOS — architecture</title>
  <desc id="d">Les visiteurs (jury, recruteurs) ouvrent remim.me en HTTPS : le nom de domaine, géré chez Namecheap, mène à GitHub Pages, qui sert le portfolio, et le sous-domaine dashboard.remim.me au tableau de bord. Chaque page vue est comptée par GoatCounter, sans cookie. J'écris le contenu dans VS Code ou depuis le tableau de bord, qui enregistre les synthèses dans le dépôt du site par l'API GitHub. Chaque envoi déclenche GitHub Actions : deploy.yml teste le site puis le publie ; une erreur bloque la mise en ligne. Chaque lundi, veille.yml lit les flux RSS de 33 sources, fait choisir et résumer les articles par GitHub Copilot, enregistre les actualités dans le dépôt et rappelle par une issue les synthèses à écrire. reformuler.yml fait reformuler un passage par Copilot, à la demande du tableau de bord.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <rect width="800" height="668" fill="#ffffff"/>

  <!-- Titre -->
  <text x="32" y="44" font-size="20" font-weight="600" fill="#1a1d23">Portfolio RémiOS — architecture</text>
  <text x="32" y="68" font-size="13" fill="#4a5260">Publication, veille automatique et tableau de bord, sans serveur à administrer</text>
  <line x1="32" y1="84" x2="768" y2="84" stroke="#1a1d23" stroke-width="1"/>

  <!-- Visiteurs -->
  <rect x="32" y="124" width="200" height="92" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="48" y="148" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">VISITEURS</text>
  <text x="48" y="174" font-size="14" font-weight="600" fill="#1a1d23">Jury, recruteurs</text>
  <text x="48" y="194" font-size="12" fill="#4a5260">navigateur web</text>

  <!-- Édition -->
  <rect x="32" y="448" width="200" height="92" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="48" y="472" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">ÉDITION</text>
  <text x="48" y="498" font-size="14" font-weight="600" fill="#1a1d23">Moi</text>
  <text x="48" y="518" font-size="12" fill="#4a5260">VS Code, git</text>
  <text x="48" y="534" font-size="12" fill="#4a5260">tableau de bord</text>

  <!-- GitHub -->
  <rect x="272" y="96" width="296" height="468" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="116" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">GITHUB</text>

  <rect x="292" y="124" width="256" height="92" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="308" y="150" font-size="15" font-weight="600" fill="#1a1d23">GitHub Pages</text>
  <text x="308" y="172" font-size="12" fill="#4a5260">remim.me : le portfolio</text>
  <text x="308" y="190" font-size="12" fill="#4a5260">dashboard.remim.me : pilotage</text>

  <rect x="292" y="256" width="256" height="152" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="308" y="282" font-size="15" font-weight="600" fill="#1a1d23">GitHub Actions</text>
  <text x="308" y="306" font-size="12" fill="#4a5260">deploy.yml : teste, publie</text>
  <text x="308" y="326" font-size="12" fill="#4a5260">veille.yml : chaque lundi</text>
  <text x="308" y="346" font-size="12" fill="#4a5260">reformuler.yml : à la demande</text>
  <line x1="308" y1="362" x2="532" y2="362" stroke="#d5d9e0" stroke-width="1"/>
  <text x="308" y="384" font-size="12" fill="#4a5260">rappel des synthèses (issue)</text>

