<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 708" width="800" height="708" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
  <title id="t">CAFFEIN — architecture</title>
  <desc id="d">Le freelance décrit sa facture en une phrase depuis son navigateur. Le nom de domaine (DNS) mène au serveur Linux hébergé chez Hostinger, où Nginx, en reverse proxy HTTPS, relaie la requête vers le service caffein.service, qui n'écoute qu'en local : une API Python FastAPI, l'interface React et huit scripts planifiés qui remplacent les workflows n8n de la première version. L'API Claude transforme la phrase en brouillon structuré ; sans clé, une analyse locale prend le relais. La facture et son PDF sont enregistrés dans les données locales (base SQLite, justificatifs chiffrés en AES-256-GCM). Les scripts envoient ensuite la facture au client final par SMTP, puis les relances.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <rect width="800" height="708" fill="#ffffff"/>

  <!-- Titre -->
  <text x="32" y="44" font-size="20" font-weight="600" fill="#1a1d23">CAFFEIN — architecture</text>
  <text x="32" y="68" font-size="13" fill="#4a5260">Parcours d'une demande, de la phrase à la facture envoyée</text>
  <line x1="32" y1="84" x2="768" y2="84" stroke="#1a1d23" stroke-width="1"/>

  <!-- Utilisateur -->
  <rect x="32" y="150" width="170" height="100" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="48" y="174" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">UTILISATEUR</text>
  <text x="48" y="200" font-size="14" font-weight="600" fill="#1a1d23">Freelance, TPE</text>
  <text x="48" y="220" font-size="12" fill="#4a5260">micro-entrepreneur</text>
  <text x="48" y="238" font-size="12" fill="#4a5260">navigateur web</text>

  <!-- Serveur Linux chez Hostinger -->
  <rect x="252" y="116" width="280" height="430" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="268" y="138" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">SERVEUR LINUX · HOSTINGER</text>

  <rect x="272" y="152" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="178" font-size="15" font-weight="600" fill="#1a1d23">Nginx</text>
  <text x="288" y="198" font-size="12" fill="#4a5260">reverse proxy · HTTPS</text>

  <rect x="272" y="244" width="240" height="160" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="272" font-size="15" font-weight="600" fill="#1a1d23">caffein.service</text>
  <text x="288" y="294" font-size="12" fill="#4a5260">API FastAPI · interface React</text>
  <text x="288" y="312" font-size="12" fill="#4a5260">8 scripts planifiés (ex-n8n)</text>
  <line x1="288" y1="326" x2="496" y2="326" stroke="#d5d9e0" stroke-width="1"/>
  <text x="288" y="346" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">MODULES</text>
  <text x="288" y="368" font-size="13" font-weight="600" fill="#1a1d23">devis · factures · clients</text>
  <text x="288" y="388" font-size="13" font-weight="600" fill="#1a1d23">documents · TVA · URSSAF</text>

  <rect x="272" y="444" width="240" height="82" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="470" font-size="15" font-weight="600" fill="#1a1d23">Données locales</text>
  <text x="288" y="490" font-size="12" fill="#4a5260">base SQLite, justificatifs</text>
  <text x="288" y="508" font-size="12" fill="#4a5260">chiffrés en AES-256-GCM</text>

  <!-- Services externes -->
  <rect x="592" y="196" width="176" height="224" rx="8" fill="#eef2fa" stroke="#1e3c8c" stroke-width="1.5"/>
  <text x="608" y="220" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">SERVICES EXTERNES</text>

  <rect x="608" y="232" width="144" height="80" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="624" y="260" font-size="15" font-weight="600" fill="#1a1d23">API Claude</text>
  <text x="624" y="282" font-size="12" fill="#4a5260">comprend et</text>
  <text x="624" y="298" font-size="12" fill="#4a5260">rédige</text>

  <rect x="608" y="328" width="144" height="76" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="624" y="356" font-size="15" font-weight="600" fill="#1a1d23">SMTP</text>
  <text x="624" y="378" font-size="12" fill="#4a5260">envoi des</text>
  <text x="624" y="394" font-size="12" fill="#4a5260">emails</text>

  <!-- Client final -->
  <rect x="592" y="446" width="176" height="100" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="608" y="470" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">DESTINATAIRE</text>
  <text x="608" y="496" font-size="14" font-weight="600" fill="#1a1d23">Client final</text>
  <text x="608" y="516" font-size="12" fill="#4a5260">reçoit la facture</text>
  <text x="608" y="534" font-size="12" fill="#4a5260">PDF + page en ligne</text>

  <!-- Flèches -->
  <g fill="none" stroke="#1a1d23" stroke-width="1.5" marker-end="url(#a)">
    <path d="M202 182 H271"/>
    <path d="M392 212 V243"/>
    <path d="M514 272 H607" marker-start="url(#a)"/>
    <path d="M514 366 H607"/>
    <path d="M392 406 V443" marker-start="url(#a)"/>
    <path d="M680 405 V445"/>
  </g>
  <text x="237" y="206" font-size="11" fill="#4a5260" text-anchor="middle">DNS</text>

  <!-- Pastilles des étapes -->
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="202" cy="150" r="10" fill="#1e3c8c"/><text x="202" y="154">1</text>
    <circle cx="237" cy="182" r="10" fill="#1e3c8c"/><text x="237" y="186">2</text>
    <circle cx="412" cy="228" r="10" fill="#1e3c8c"/><text x="412" y="232">3</text>
    <circle cx="562" cy="272" r="10" fill="#1e3c8c"/><text x="562" y="276">4</text>
    <circle cx="412" cy="425" r="10" fill="#1e3c8c"/><text x="412" y="429">5</text>
    <circle cx="562" cy="366" r="10" fill="#1e3c8c"/><text x="562" y="370">6</text>
  </g>

  <!-- Légende des étapes -->
  <g font-size="12" fill="#1a1d23">
    <g font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">
      <circle cx="41" cy="580" r="9" fill="#1e3c8c"/><text x="41" y="584">1</text>
      <circle cx="41" cy="604" r="9" fill="#1e3c8c"/><text x="41" y="608">2</text>
      <circle cx="41" cy="628" r="9" fill="#1e3c8c"/><text x="41" y="632">3</text>
      <circle cx="425" cy="580" r="9" fill="#1e3c8c"/><text x="425" y="584">4</text>
      <circle cx="425" cy="604" r="9" fill="#1e3c8c"/><text x="425" y="608">5</text>
      <circle cx="425" cy="628" r="9" fill="#1e3c8c"/><text x="425" y="632">6</text>
    </g>
    <text x="58" y="584">L'utilisateur décrit sa facture en une phrase</text>
    <text x="58" y="608">Le DNS mène au serveur, Nginx gère le HTTPS</text>
    <text x="58" y="632">Nginx relaie vers Caffein (127.0.0.1:8000)</text>
    <text x="442" y="584">Claude en fait un brouillon (ou repli local)</text>
    <text x="442" y="608">La facture et son PDF sont enregistrés</text>
    <text x="442" y="632">Envoi au client, puis relances par email</text>
  </g>

  <!-- Pied -->
  <line x1="32" y1="664" x2="768" y2="664" stroke="#d5d9e0" stroke-width="1"/>
  <text x="32" y="686" font-size="11.5" fill="#4a5260">Développement assisté par Claude Code</text>
  <text x="768" y="686" font-size="11.5" fill="#4a5260" text-anchor="end">Rémi Moreau · remim.me</text>
</svg>
