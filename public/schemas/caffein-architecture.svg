<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 676" width="800" height="676" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
  <title id="t">CAFFEIN — architecture</title>
  <desc id="d">L'utilisateur, artisan du BTP ou micro-entrepreneur, écrit ou parle à l'assistant depuis son navigateur. Le nom de domaine (DNS) mène au serveur Linux hébergé chez Hostinger, où Nginx sert l'application Python : interface web en HTML, assistant IA et modules du logiciel (facturation, CRM, ERP). À l'oral, l'API Whisper transcrit la voix en texte ; l'API Claude comprend la demande, puis l'assistant réalise la tâche dans le logiciel. n8n automatise des workflows.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <rect width="800" height="676" fill="#ffffff"/>

  <!-- Titre -->
  <text x="32" y="44" font-size="20" font-weight="600" fill="#1a1d23">CAFFEIN — architecture</text>
  <text x="32" y="68" font-size="13" fill="#4a5260">Parcours d'une demande, de l'utilisateur au logiciel</text>
  <line x1="32" y1="84" x2="768" y2="84" stroke="#1a1d23" stroke-width="1"/>

  <!-- Utilisateur -->
  <rect x="32" y="150" width="170" height="100" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="48" y="174" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">UTILISATEUR</text>
  <text x="48" y="200" font-size="14" font-weight="600" fill="#1a1d23">Artisan du BTP</text>
  <text x="48" y="220" font-size="12" fill="#4a5260">micro-entrepreneur</text>
  <text x="48" y="238" font-size="12" fill="#4a5260">navigateur web</text>

  <!-- Serveur Linux chez Hostinger -->
  <rect x="252" y="116" width="280" height="300" rx="8" fill="#f5f6f8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="268" y="138" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">SERVEUR LINUX · HOSTINGER</text>

  <rect x="272" y="152" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="178" font-size="15" font-weight="600" fill="#1a1d23">Nginx</text>
  <text x="288" y="198" font-size="12" fill="#4a5260">serveur web</text>

  <rect x="272" y="244" width="240" height="150" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="272" font-size="15" font-weight="600" fill="#1a1d23">Application Python</text>
  <text x="288" y="294" font-size="12" fill="#4a5260">interface web en HTML</text>
  <text x="288" y="312" font-size="12" fill="#4a5260">assistant IA, texte ou voix</text>
  <line x1="288" y1="328" x2="496" y2="328" stroke="#d5d9e0" stroke-width="1"/>
  <text x="288" y="350" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">MODULES DU LOGICIEL</text>
  <text x="288" y="374" font-size="13" font-weight="600" fill="#1a1d23">facturation · CRM · ERP</text>

  <!-- API externes -->
  <rect x="592" y="196" width="176" height="220" rx="8" fill="#eef2fa" stroke="#1e3c8c" stroke-width="1.5"/>
  <text x="608" y="220" font-size="11" font-weight="600" letter-spacing="1.5" fill="#1e3c8c">API EXTERNES</text>

  <rect x="608" y="232" width="144" height="70" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="624" y="260" font-size="15" font-weight="600" fill="#1a1d23">API Whisper</text>
  <text x="624" y="282" font-size="12" fill="#4a5260">voix → texte</text>

  <rect x="608" y="322" width="144" height="80" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="624" y="350" font-size="15" font-weight="600" fill="#1a1d23">API Claude</text>
  <text x="624" y="372" font-size="12" fill="#4a5260">comprend la</text>
  <text x="624" y="388" font-size="12" fill="#4a5260">demande</text>

  <!-- n8n -->
  <rect x="272" y="452" width="240" height="60" rx="6" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="288" y="478" font-size="15" font-weight="600" fill="#1a1d23">n8n</text>
  <text x="288" y="498" font-size="12" fill="#4a5260">automatisation de workflows</text>

  <!-- Flèches -->
  <g fill="none" stroke="#1a1d23" stroke-width="1.5" marker-end="url(#a)">
    <path d="M202 182 H271"/>
    <path d="M392 212 V243"/>
    <path d="M514 267 H607" marker-start="url(#a)"/>
    <path d="M514 362 H607" marker-start="url(#a)"/>
    <path d="M392 396 V451" marker-start="url(#a)"/>
  </g>
  <text x="237" y="206" font-size="11" fill="#4a5260" text-anchor="middle">DNS</text>

  <!-- Pastilles des étapes -->
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="202" cy="150" r="10" fill="#1e3c8c"/><text x="202" y="154">1</text>
    <circle cx="237" cy="182" r="10" fill="#1e3c8c"/><text x="237" y="186">2</text>
    <circle cx="412" cy="228" r="10" fill="#1e3c8c"/><text x="412" y="232">3</text>
    <circle cx="562" cy="267" r="10" fill="#1e3c8c"/><text x="562" y="271">4</text>
    <circle cx="562" cy="362" r="10" fill="#1e3c8c"/><text x="562" y="366">5</text>
    <circle cx="494" cy="346" r="10" fill="#1e3c8c"/><text x="494" y="350">6</text>
  </g>

  <!-- Légende des étapes -->
  <g font-size="12" fill="#1a1d23">
    <g font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">
      <circle cx="41" cy="552" r="9" fill="#1e3c8c"/><text x="41" y="556">1</text>
      <circle cx="41" cy="576" r="9" fill="#1e3c8c"/><text x="41" y="580">2</text>
      <circle cx="41" cy="600" r="9" fill="#1e3c8c"/><text x="41" y="604">3</text>
      <circle cx="425" cy="552" r="9" fill="#1e3c8c"/><text x="425" y="556">4</text>
      <circle cx="425" cy="576" r="9" fill="#1e3c8c"/><text x="425" y="580">5</text>
      <circle cx="425" cy="600" r="9" fill="#1e3c8c"/><text x="425" y="604">6</text>
    </g>
    <text x="58" y="556">L'utilisateur écrit ou parle à l'assistant</text>
    <text x="58" y="580">Le nom de domaine (DNS) mène au serveur</text>
    <text x="58" y="604">Nginx sert l'application Python</text>
    <text x="442" y="556">À l'oral, Whisper transcrit la voix</text>
    <text x="442" y="580">L'API Claude comprend la demande</text>
    <text x="442" y="604">L'assistant réalise la tâche demandée</text>
  </g>

  <!-- Pied -->
  <line x1="32" y1="636" x2="768" y2="636" stroke="#d5d9e0" stroke-width="1"/>
  <text x="32" y="658" font-size="11.5" fill="#4a5260">Développement assisté par Claude Code</text>
  <text x="768" y="658" font-size="11.5" fill="#4a5260" text-anchor="end">Rémi Moreau · remim.me</text>
</svg>
