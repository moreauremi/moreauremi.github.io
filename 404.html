<!doctype html>
<html lang="fr" data-view="tui">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Page affichée par le serveur pour toute adresse inconnue, quelle que
         soit sa profondeur (/a/b/c) : <base> fait partir ses liens et ses
         fichiers (CSS, police) de la racine du site. -->
    <base href="/">
    <title>Page introuvable (erreur 404) — RémiOS</title>
    <!-- Page d'erreur : à ne pas proposer dans les résultats de recherche -->
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1e3c8c">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/styles/errors.css">
    <script type="module" src="/src/errors.js"></script>
  </head>
  <body>
    <!-- Cadre commun aux pages d'erreur (barre du haut, boîte, boutons, pied
         de page) : src/error-layout.html. Le contenu propre à cette page,
         ci-dessous, y est inséré par plugins/vite-plugin-inline.js. -->
    <template data-layout="/src/error-layout.html">
      <h1 class="tui-box-title" id="error-title"><span aria-hidden="true">[ </span>Erreur 404<span aria-hidden="true"> ]</span></h1>
      <div class="tui-box-inner">
        <pre class="error-code" aria-hidden="true">
 _  _      ___    _  _
| || |    / _ \  | || |
| || |_  | | | | | || |_
|__   _| | |_| | |__   _|
   |_|    \___/     |_|</pre>
        <pre class="error-shell"><span class="error-prompt">visiteur@remios:~$</span> cd <span data-path>/page-demandée</span>
bash: cd: <span data-path>/page-demandée</span>&nbsp;: aucun fichier ou dossier de ce nom</pre>
        <p>Cette page n'existe pas, ou plus. Vérifiez l'adresse, ou repartez du menu principal&nbsp;: toutes les rubriques et les réalisations s'y trouvent.</p>
      </div>
    </template>
  </body>
</html>
