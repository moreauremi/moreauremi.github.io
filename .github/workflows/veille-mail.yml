# =============================================================================
# Veille par e-mail : traitement de ma réponse
# -----------------------------------------------------------------------------
# Lancé par le relais Gmail (apps-script/veille-mail.js) quand je réponds à un
# e-mail de la veille : le relais range ma réponse dans la version brouillon
# de l'échange, puis lance ce workflow avec son numéro. scripts/veille-mail.mjs
# lit la réponse et, selon l'étape :
#   - réponse aux actualités du lundi (« 1, 3 : mon avis… ») : l'IA met mon
#     avis en forme de synthèse, renvoyée à relire par e-mail ;
#   - réponse à la relecture : « ok » publie la synthèse (un commit de
#     content/veille/<sujet>/syntheses.md, puis publication du site),
#     « annule » abandonne, tout autre texte est une correction.
# L'e-mail suivant est écrit dans le même brouillon, et le relais l'envoie.
#
# L'IA est celle de la veille : GitHub Copilot, avec le même secret
# COPILOT_GITHUB_TOKEN (voir veille.yml et le README).
#
# Essai sans attendre lundi : onglet Actions → « Veille par e-mail » → Run
# workflow, avec « essai » : les 3 dernières actualités de chaque sujet sont
# envoyées par le relais dans les 10 minutes.
# =============================================================================

name: Veille par e-mail

on:
  workflow_dispatch:
    inputs:
      demande:
        description: Numéro de la version brouillon de l'échange (lancé par le relais Gmail), ou « essai » pour recevoir les dernières actualités
        required: true
        type: string
        default: essai

# Lire et écrire le brouillon, enregistrer la synthèse ; relancer la publication
permissions:
  contents: write
  actions: write

# Une seule tâche à la fois par échange
concurrency:
  group: veille-mail-${{ inputs.demande }}
  cancel-in-progress: false

jobs:
  repondre:
    name: Traiter ma réponse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js (version indiquée dans .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Version fixée : une nouvelle version peut changer de comportement sans
      # prévenir. 1.0.94 est la dernière validée par une collecte réussie (9 octobre
      # 2026). Pour la mettre à jour : changer le numéro dans les trois workflows.
      - name: Installer Copilot CLI
        run: npm install -g @github/copilot@1.0.94

      # Le numéro de l'échange passe par une variable d'environnement, jamais
      # directement dans la commande (pas d'injection possible)
      - name: Traiter la réponse
        run: node scripts/veille-mail.mjs
        env:
          VEILLE_MAIL_ID: ${{ inputs.demande }}
          VEILLE_IA_CLE: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # Échec avant d'avoir répondu (installation, GitHub indisponible…) : je
      # suis prévenu par e-mail au lieu d'attendre. Sans effet si le script a
      # déjà écrit sa réponse dans le brouillon.
      - name: Prévenir par e-mail en cas d'échec
        if: failure()
        run: node scripts/veille-mail.mjs --echec
        env:
          VEILLE_MAIL_ID: ${{ inputs.demande }}
          GH_TOKEN: ${{ github.token }}
