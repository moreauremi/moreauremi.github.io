# =============================================================================
# Publication automatique sur GitHub Pages (https://remim.me)
# -----------------------------------------------------------------------------
# À chaque envoi (push) sur la branche main, GitHub :
#   1. récupère le code et installe les outils (npm ci) ;
#   2. fabrique le site (npm run build) : c'est aussi là que les fiches
#      Markdown sont vérifiées ; une fiche mal remplie fait échouer la
#      publication, et le site en ligne reste intact ;
#   3. publie le dossier dist/ sur GitHub Pages.
# Le suivi se fait dans l'onglet « Actions » du dépôt.
# =============================================================================

name: Publication sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer la publication à la main depuis l'onglet Actions
  workflow_dispatch:

# Droits minimaux : lire le code, écrire sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle annule celle en attente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Fabrication du site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js (version indiquée dans .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les outils
        run: npm ci

      - name: Fabriquer le site
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le dossier dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
