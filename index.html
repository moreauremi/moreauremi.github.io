<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget : quand le clavier virtuel s'ouvre (mobile), la page
         se redimensionne au lieu d'être recouverte : le terminal reste visible -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <!-- Titre et description : remplacés au build par ceux de
         content/site.config.js (rubrique « referencement ») -->
    <title>RémiOS — Rémi Moreau · Portfolio BTS SIO SISR</title>
    <meta
      name="description"
      content="Portfolio de Rémi Moreau, étudiant en BTS SIO option SISR à MyDigitalSchool Nantes."
    />
    <meta name="author" content="Rémi Moreau" />
    <!-- Couleur de la barre du navigateur sur mobile : noir, comme l'écran de boot -->
    <meta name="theme-color" content="#000000" />

    <!-- Icônes : onglet du navigateur, et écran d'accueil sur iPhone/iPad
         (fichiers copiés tels quels depuis public/) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph : titre et description affichés quand le lien est partagé
         (LinkedIn, Teams, Discord…). L'adresse du site et l'image d'aperçu
         doivent être des URL complètes : le build les ajoute automatiquement
         dès que « urlPublique » est renseignée dans content/site.config.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="RémiOS" />
    <meta property="og:title" content="Rémi Moreau · Portfolio BTS SIO SISR" />
    <meta
      property="og:description"
      content="Portfolio de Rémi Moreau, étudiant en BTS SIO option SISR à MyDigitalSchool Nantes."
    />

    <!-- Préchargement de la police principale : le navigateur la télécharge dès
         la lecture de cette page, sans attendre le CSS. Le boot s'affiche ainsi
         directement dans la bonne police. -->
    <link
      rel="preload"
      href="./src/assets/fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Conteneur dans lequel le JavaScript construit l'interface -->
    <div id="app"></div>

    <!-- Version sans JavaScript : remplacée au build par un résumé (nom,
         formation, liens de contact) tiré de content/site.config.js -->
    <noscript data-fallback>Ce portfolio a besoin de JavaScript pour s'afficher.</noscript>

    <!-- Point d'entrée : Vite remplace ce chemin par le fichier final optimisé au build -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
