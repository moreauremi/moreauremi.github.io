# =============================================================================
# En-têtes de sécurité HTTP, inclus dans chaque bloc « location » de nginx.conf
# -----------------------------------------------------------------------------
# Piège de nginx : un add_header placé dans un bloc location annule tous ceux
# du bloc server. Ce fichier est donc inclus à chaque endroit.
# « always » : envoyés aussi sur les réponses d'erreur (404…).
# Le HSTS (HTTPS obligatoire) est à configurer sur le reverse proxy, qui gère le HTTPS.
# =============================================================================

# Politique de sécurité du contenu (CSP) : scripts, styles, polices et images
# ne peuvent venir QUE de ce site. Un script injecté ou externe ne s'exécute pas.
# Possible parce que le site n'a aucun script ni style écrit dans le HTML.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Le navigateur ne « devine » pas le type d'un fichier : il suit celui annoncé
add_header X-Content-Type-Options "nosniff" always;

# Interdit d'afficher le site dans un cadre d'un autre site (anti-clickjacking)
add_header X-Frame-Options "DENY" always;

# Adresse de provenance transmise aux autres sites : seulement le domaine
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Fonctions du navigateur inutiles au site, désactivées
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Isole la page des fenêtres ouvertes par d'autres sites
add_header Cross-Origin-Opener-Policy "same-origin" always;
