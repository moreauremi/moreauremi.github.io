# =============================================================================
# Configuration nginx du conteneur
# -----------------------------------------------------------------------------
# Sert le site statique (dist/) en HTTP sur le port 80 du conteneur.
# Le HTTPS et le nom de domaine sont gérés par le reverse proxy du homelab,
# placé devant ce conteneur.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas afficher la version de nginx dans les en-têtes et les pages d'erreur
    server_tokens off;

    # --- Compression gzip ----------------------------------------------------
    # Les fichiers texte sont compressés avant l'envoi (souvent 3 à 4 fois plus
    # légers). Les polices woff2 et les images sont déjà compressées : inutile.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;   # les tout petits fichiers ne gagnent rien
    gzip_vary on;          # prévient les caches que la réponse dépend du navigateur
    gzip_proxied any;      # compresse aussi les requêtes relayées par le reverse proxy
    # text/xml : sitemap.xml (nginx annonce les fichiers .xml sous ce type)
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
    # (le HTML est toujours compressé quand gzip est actif)

    # --- Pages d'erreur du site ----------------------------------------------
    # Remplacent les pages par défaut de nginx (« 404 Not Found » sur fond blanc)
    # par celles du site, dans le style RémiOS.
    # 403 : par exemple un dossier sans index.html (/captures/), dont nginx
    # refuse d'afficher la liste des fichiers.
    # La page 503 sert au reverse proxy quand ce conteneur est arrêté (voir le
    # README) : le conteneur lui-même ne répond jamais 503.
    error_page 403 /403.html;
    error_page 404 /404.html;

    # « internal » : ces pages ne sont servies qu'à la place d'une erreur ;
    # demandées directement (/404.html), elles répondent 404.
    # Jamais en cache : elles citent les fichiers hashés de la version en cours.
    location ~ ^/(403|404|503)\.html$ {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- index.html : jamais en cache ----------------------------------------
    # C'est lui qui indique les noms des fichiers hashés : il doit toujours être
    # à jour pour qu'une nouvelle version du site soit vue immédiatement.
    # (La page d'accueil « / » est redirigée ici en interne par « index ».)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- Fichiers hashés par Vite : cache d'un an ----------------------------
    # assets/index-B1nUFkjj.js : le nom change à chaque modification du contenu.
    # On peut donc demander au navigateur de les garder un an sans jamais
    # revérifier (« immutable ») : une nouvelle version aura un autre nom.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Autres fichiers : cache d'une heure ---------------------------------
    # Favicon, captures, PDF… gardent le même nom quand ils changent : cache court.
    # Pas de renvoi vers index.html pour les adresses inconnues : le site
    # utilise le hash (#/…) pour naviguer, toute autre adresse est une vraie 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }
}
